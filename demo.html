<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY - Internship Platform Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6b92ff 0%, #4259e8 100%);
            --success-gradient: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            --accent-gradient: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
        }
        
        .bg-gradient-blue { background: var(--primary-gradient); }
        .bg-gradient-green { background: var(--success-gradient); }
        .bg-gradient-purple { background: var(--accent-gradient); }
        
        .card {
            @apply bg-white rounded-xl shadow-md hover:shadow-lg transition;
        }
        
        .btn-primary {
            @apply px-6 py-3 bg-gradient-blue text-white rounded-lg font-semibold hover:shadow-lg transition;
        }
        
        .internship-card {
            @apply card hover:shadow-xl transition transform hover:-translate-y-2 cursor-pointer overflow-hidden;
        }
        
        .internship-card-header {
            @apply h-40 bg-gradient-blue flex items-center justify-center text-6xl;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="app"></div>

    <script>
        // Simple state management
        let currentView = 'studentDashboard';
        let selectedInternship = null;
        let showApplicationModal = false;
        let showAcceptanceModal = false;
        let selectedApplication = null;
        let acceptanceData = null;
        
        const internships = [
            {
                id: 1,
                title: 'Frontend Developer',
                company: 'Tech Startup Co.',
                location: 'Remote',
                salary: '$500/month',
                duration: '3 months',
                description: 'Build beautiful web applications with React and Tailwind CSS.',
                icon: '💼'
            },
            {
                id: 2,
                title: 'UI/UX Designer',
                company: 'Digital Agency',
                location: 'Lagos, Nigeria',
                salary: '$400/month',
                duration: '2-3 months',
                description: 'Design user interfaces and experiences for mobile apps.',
                icon: '🎨'
            },
            {
                id: 3,
                title: 'Product Manager',
                company: 'SaaS Company',
                location: 'Hybrid',
                salary: '$600/month',
                duration: '3-4 months',
                description: 'Help launch and manage a new product feature.',
                icon: '📊'
            },
            {
                id: 4,
                title: 'Data Analyst',
                company: 'Financial Services',
                location: 'Onsite',
                salary: '$450/month',
                duration: '3 months',
                description: 'Analyze financial data and create insights.',
                icon: '📈'
            },
            {
                id: 5,
                title: 'Marketing Specialist',
                company: 'E-commerce Platform',
                location: 'Remote',
                salary: '$350/month',
                duration: '2 months',
                description: 'Develop and execute marketing campaigns.',
                icon: '📢'
            },
            {
                id: 6,
                title: 'Backend Developer',
                company: 'Cloud Infrastructure',
                location: 'Hybrid',
                salary: '$550/month',
                duration: '3-4 months',
                description: 'Build scalable APIs and microservices.',
                icon: '⚙️'
            }
        ];
        
        const applications = [
            { id: 1, studentName: 'John Doe', appliedDate: '2 days ago', status: 'applied', internship: 'Frontend Developer' },
            { id: 2, studentName: 'Jane Smith', appliedDate: '1 week ago', status: 'reviewed', internship: 'UI/UX Designer' },
            { id: 3, studentName: 'Mike Johnson', appliedDate: '3 days ago', status: 'shortlisted', internship: 'Product Manager' }
        ];
        
        // Navigation
        function navigate(view) {
            currentView = view;
            render();
        }
        
        // Handle application
        function handleApply(internship) {
            selectedInternship = internship;
            showApplicationModal = true;
            render();
        }
        
        function submitApplication() {
            showApplicationModal = false;
            showAcceptanceModal = true;
            acceptanceData = {
                verificationCode: 'A1B2C3D4E5F6G7H8I9J0',
                studentName: 'John Doe',
                company: selectedInternship.company,
                internship: selectedInternship.title
            };
            render();
        }
        
        function handleAcceptApplication(app) {
            selectedApplication = app;
            showAcceptanceModal = true;
            acceptanceData = {
                verificationCode: 'A1B2C3D4E5F6G7H8I9J0',
                studentName: app.studentName,
                company: app.studentName + ' accepted!',
                type: 'acceptance'
            };
            render();
        }
        
        function acceptApplication() {
            showAcceptanceModal = false;
            render();
        }
        
        function closeModal() {
            showApplicationModal = false;
            showAcceptanceModal = false;
            selectedApplication = null;
            render();
        }
        
        // Render functions
        function renderNavbar() {
            return `
                <nav class="bg-white shadow-md">
                    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <div class="w-10 h-10 bg-gradient-blue rounded-lg flex items-center justify-center">
                                <span class="text-white font-bold text-xl">M</span>
                            </div>
                            <span class="font-bold text-xl text-slate-900">MY</span>
                        </div>
                        
                        <div class="flex items-center space-x-4">
                            <button onclick="navigate('studentDashboard')" class="px-4 py-2 text-slate-700 hover:text-primary-600 font-semibold">
                                Student Portal
                            </button>
                            <button onclick="navigate('employerDashboard')" class="px-4 py-2 text-slate-700 hover:text-primary-600 font-semibold">
                                Employer Dashboard
                            </button>
                            <button class="relative">
                                <span class="text-2xl">🔔</span>
                                <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full"></span>
                            </button>
                            <div class="w-10 h-10 bg-gradient-to-br from-blue-400 to-purple-600 rounded-full flex items-center justify-center text-white font-bold">JD</div>
                        </div>
                    </div>
                </nav>
            `;
        }
        
        function renderStudentDashboard() {
            return `
                <div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50">
                    <div class="max-w-7xl mx-auto px-4 py-12">
                        <div class="mb-12">
                            <h1 class="text-5xl font-bold text-slate-900 mb-4">Find Your Perfect Internship 🚀</h1>
                            <p class="text-xl text-slate-600 mb-8">Discover opportunities and launch your career with top companies.</p>
                            
                            <div class="flex gap-3 mb-6">
                                <div class="flex-1 relative">
                                    <span class="absolute left-4 top-4 text-slate-400">🔍</span>
                                    <input type="text" placeholder="Search internships by role, company, or skill..." 
                                           class="w-full pl-12 pr-4 py-3 rounded-lg border-2 border-slate-200 focus:border-blue-500 focus:outline-none">
                                </div>
                                <button class="btn-primary">Search</button>
                            </div>
                            
                            <div class="flex gap-3 flex-wrap">
                                <button class="px-4 py-2 bg-white border-2 border-slate-200 rounded-lg font-semibold hover:border-blue-500 transition">🌍 All Locations</button>
                                <button class="px-4 py-2 bg-white border-2 border-slate-200 rounded-lg font-semibold hover:border-blue-500 transition">🏠 Remote</button>
                                <button class="px-4 py-2 bg-white border-2 border-slate-200 rounded-lg font-semibold hover:border-blue-500 transition">🤝 Hybrid</button>
                                <button class="px-4 py-2 bg-white border-2 border-slate-200 rounded-lg font-semibold hover:border-blue-500 transition">🏢 Onsite</button>
                            </div>
                        </div>
                        
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900 mb-8">Featured Opportunities (${internships.length})</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${internships.map(internship => `
                                    <div class="internship-card" onclick="handleApply(${JSON.stringify(internship).replace(/"/g, '&quot;')})">
                                        <div class="internship-card-header">${internship.icon}</div>
                                        <div class="p-6">
                                            <h3 class="text-xl font-bold text-slate-900 mb-2">${internship.title}</h3>
                                            <p class="text-blue-600 font-semibold mb-3">${internship.company}</p>
                                            
                                            <div class="space-y-2 text-sm text-slate-600 mb-4">
                                                <div>📍 ${internship.location}</div>
                                                <div>⏱️ ${internship.duration}</div>
                                                <div><span class="font-semibold text-green-600">💰 ${internship.salary}</span></div>
                                            </div>
                                            
                                            <button class="w-full bg-gradient-blue text-white py-2 rounded-lg font-semibold hover:shadow-lg transition">
                                                View Details
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderEmployerDashboard() {
            return `
                <div class="flex">
                    <aside class="w-64 bg-gradient-blue text-white min-h-screen p-6">
                        <div class="mb-8">
                            <h2 class="text-2xl font-bold">MY Company</h2>
                            <p class="text-blue-100 text-sm">Employer Portal</p>
                        </div>
                        
                        <nav class="space-y-2">
                            <div class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer bg-blue-700">
                                <span class="text-xl">📊</span>
                                <span class="font-medium">Overview</span>
                            </div>
                            <div class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer">
                                <span class="text-xl">💼</span>
                                <span class="font-medium">Internship Posts</span>
                            </div>
                            <div class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer">
                                <span class="text-xl">👥</span>
                                <span class="font-medium">Applicants</span>
                                <span class="ml-auto bg-red-500 text-white text-xs rounded-full w-6 h-6 flex items-center justify-center">7</span>
                            </div>
                            <div class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer">
                                <span class="text-xl">✅</span>
                                <span class="font-medium">Confirm Completion</span>
                            </div>
                            <div class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-blue-700 transition cursor-pointer">
                                <span class="text-xl">⚙️</span>
                                <span class="font-medium">Settings</span>
                            </div>
                        </nav>
                    </aside>
                    
                    <div class="flex-1">
                        <main class="p-8 bg-slate-50 min-h-screen">
                            <div class="mb-8">
                                <p class="text-slate-600">Good morning,</p>
                                <h1 class="text-4xl font-bold text-slate-900">Guinness Cameroon 👋</h1>
                                <p class="text-slate-600 mt-2">Here's what's happening with your internship programme.</p>
                            </div>
                            
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
                                <div class="card p-6 bg-gradient-blue text-white">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <div class="flex items-center space-x-3 mb-4">
                                                <div class="text-4xl">📁</div>
                                                <div>
                                                    <p class="text-white/80 text-sm">Active Postings</p>
                                                    <p class="text-white text-3xl font-bold">02</p>
                                                </div>
                                            </div>
                                            <div class="text-sm text-green-300">↑ +1 from last month</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="card p-6 bg-gradient-green text-white">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <div class="flex items-center space-x-3 mb-4">
                                                <div class="text-4xl">👥</div>
                                                <div>
                                                    <p class="text-white/80 text-sm">New Applicants</p>
                                                    <p class="text-white text-3xl font-bold">07</p>
                                                </div>
                                            </div>
                                            <div class="text-sm text-green-200">↑ +23% from last month</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="card p-6 bg-gradient-purple text-white">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <div class="flex items-center space-x-3 mb-4">
                                                <div class="text-4xl">✅</div>
                                                <div>
                                                    <p class="text-white/80 text-sm">Completed Internships</p>
                                                    <p class="text-white text-3xl font-bold">12</p>
                                                </div>
                                            </div>
                                            <div class="text-sm text-purple-200">92% completion rate</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div class="lg:col-span-2 card p-6">
                                    <h2 class="text-2xl font-bold text-slate-900 mb-6">Recent Applications</h2>
                                    <div class="space-y-3">
                                        ${applications.map(app => `
                                            <div class="card p-4 flex items-center justify-between hover:shadow-lg transition">
                                                <div class="flex items-center space-x-4">
                                                    <div class="w-12 h-12 rounded-full bg-gradient-blue flex items-center justify-center text-white font-bold">JD</div>
                                                    <div>
                                                        <h4 class="font-semibold text-slate-900">${app.studentName}</h4>
                                                        <p class="text-sm text-slate-600">${app.appliedDate}</p>
                                                    </div>
                                                </div>
                                                
                                                <div class="flex items-center space-x-3">
                                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${
                                                        app.status === 'applied' ? 'bg-blue-100 text-blue-800' :
                                                        app.status === 'reviewed' ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-purple-100 text-purple-800'
                                                    }">
                                                        ${app.status}
                                                    </span>
                                                    <button onclick="handleAcceptApplication(${JSON.stringify(app).replace(/"/g, '&quot;')})" 
                                                            class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">
                                                        Review
                                                    </button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                
                                <div class="space-y-3">
                                    <h3 class="text-lg font-bold text-slate-900 mb-4">Quick Actions</h3>
                                    <div class="card p-6 hover:shadow-xl transition transform hover:-translate-y-2 cursor-pointer border-l-4 border-blue-500">
                                        <div class="flex items-start space-x-4">
                                            <div class="text-3xl text-blue-600">➕</div>
                                            <div class="flex-1">
                                                <h3 class="font-semibold text-slate-900">Post new internship</h3>
                                                <p class="text-slate-600 text-sm mt-1">Create a new internship position</p>
                                            </div>
                                            <span class="text-2xl text-blue-300">→</span>
                                        </div>
                                    </div>
                                    <div class="card p-6 hover:shadow-xl transition transform hover:-translate-y-2 cursor-pointer border-l-4 border-blue-500">
                                        <div class="flex items-start space-x-4">
                                            <div class="text-3xl text-blue-600">👥</div>
                                            <div class="flex-1">
                                                <h3 class="font-semibold text-slate-900">Review applicants</h3>
                                                <p class="text-slate-600 text-sm mt-1">View and shortlist candidates</p>
                                            </div>
                                            <span class="text-2xl text-blue-300">→</span>
                                        </div>
                                    </div>
                                    <div class="card p-6 hover:shadow-xl transition transform hover:-translate-y-2 cursor-pointer border-l-4 border-blue-500">
                                        <div class="flex items-start space-x-4">
                                            <div class="text-3xl text-blue-600">✅</div>
                                            <div class="flex-1">
                                                <h3 class="font-semibold text-slate-900">Confirm completion</h3>
                                                <p class="text-slate-600 text-sm mt-1">Mark internships as completed</p>
                                            </div>
                                            <span class="text-2xl text-blue-300">→</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }
        
        function renderApplicationModal() {
            if (!showApplicationModal || !selectedInternship) return '';
            
            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full">
                        <div class="bg-gradient-blue text-white p-6 flex justify-between items-center">
                            <h2 class="text-2xl font-bold">Apply for ${selectedInternship.title}</h2>
                            <button onclick="closeModal()" class="text-2xl hover:opacity-80">✕</button>
                        </div>
                        
                        <form class="p-6 space-y-6" onsubmit="event.preventDefault(); submitApplication();">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Company</label>
                                <input type="text" value="${selectedInternship.company}" disabled class="w-full px-4 py-2 bg-slate-100 rounded-lg">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Position</label>
                                <input type="text" value="${selectedInternship.title}" disabled class="w-full px-4 py-2 bg-slate-100 rounded-lg">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Cover Letter</label>
                                <textarea placeholder="Tell us why you're interested in this position..." rows="6" 
                                          class="w-full px-4 py-3 border-2 border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none">I am very interested in this Frontend Developer position because I love building beautiful web applications...</textarea>
                            </div>
                            
                            <div class="flex gap-3 pt-4 border-t">
                                <button type="button" onclick="closeModal()" class="flex-1 px-6 py-3 bg-slate-100 text-slate-900 rounded-lg font-semibold hover:bg-slate-200">
                                    Cancel
                                </button>
                                <button type="submit" class="flex-1 btn-primary">
                                    Submit Application
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }
        
        function renderAcceptanceModal() {
            if (!showAcceptanceModal || !acceptanceData) return '';
            
            return `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                    <div class="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full text-center">
                        <div class="text-6xl mb-4 text-center text-green-500">✅</div>
                        <h2 class="text-2xl font-bold text-green-600 mb-4">Application Submitted!</h2>
                        <p class="text-slate-600 mb-6">We'll notify you when the employer reviews your application.</p>
                        
                        <div class="bg-slate-100 p-4 rounded-lg mb-4">
                            <p class="text-sm text-slate-600 mb-2">For Employer - Verification Code:</p>
                            <p class="font-mono font-bold text-lg text-blue-600">${acceptanceData.verificationCode}</p>
                        </div>
                        
                        <div class="flex justify-center mb-4">
                            <div class="w-32 h-32 bg-gradient-to-br from-blue-400 to-purple-600 rounded-lg flex items-center justify-center text-white text-xs font-bold p-2 text-center">
                                QR CODE\nSCAN HERE
                            </div>
                        </div>
                        
                        <button onclick="closeModal()" class="w-full btn-primary">
                            Continue
                        </button>
                    </div>
                </div>
            `;
        }
        
        function render() {
            const app = document.getElementById('app');
            
            let content = renderNavbar();
            
            if (currentView === 'studentDashboard') {
                content += renderStudentDashboard();
            } else if (currentView === 'employerDashboard') {
                content += renderEmployerDashboard();
            }
            
            content += renderApplicationModal();
            content += renderAcceptanceModal();
            
            app.innerHTML = content;
        }
        
        // Initial render
        render();
    </script>
</body>
</html>
